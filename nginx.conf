server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # ── SPA routing ──────────────────────────────────────────────────────────
    # Try the exact file, then a directory, then fall back to index.html so
    # React Router can handle the URL on the client side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Compression ──────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/html text/css application/javascript application/json
               image/svg+xml font/woff2;
    gzip_min_length 1024;
    gzip_vary on;

    # ── Caching ──────────────────────────────────────────────────────────────
    # Vite fingerprints hashed asset filenames — safe to cache for 1 year.
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|ico|svg|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # index.html must never be cached so the browser always fetches the latest
    # shell pointing to the correct hashed assets.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

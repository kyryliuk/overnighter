name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check API
        run: npm run typecheck:api

      - name: Run tests
        run: npm test

      - name: Build app
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────
  # Validates the CDK infra package compiles cleanly. Runs in parallel with
  # the quality job so infra regressions are caught on every PR/push.
  # ─────────────────────────────────────────────────────────────────────────
  lint-infra:
    name: Build infra (CDK TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install infra dependencies
        working-directory: infra
        run: npm ci

      - name: Compile infra TypeScript
        working-directory: infra
        run: npm run build

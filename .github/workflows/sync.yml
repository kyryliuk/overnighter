name: Daily Data Sync

on:
  schedule:
    - cron: '0 2 * * *'  # 2am UTC daily — syncs BLM/USFS/NPS pin data
  workflow_dispatch:       # Manual trigger for testing without waiting for cron

jobs:
  sync:
    name: Sync pin data from BLM/USFS/NPS APIs
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync endpoint
        run: |
          curl -f -X POST "${{ secrets.SYNC_URL }}" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 60

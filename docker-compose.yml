version: "3.9"

services:

  # ── React SPA (served by nginx) ────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Pass VITE_* build-time variables from your .env file.
      # These are baked into the JS bundle at build time, not injected at
      # runtime, so they must be present when the image is built.
      args:
        - VITE_SUPABASE_URL
        - VITE_SUPABASE_ANON_KEY
        - VITE_STRIPE_PUBLISHABLE_KEY
        - VITE_SENTRY_DSN
    ports:
      - "3000:80"
    # Copy .env.example → .env and fill in your values before running.
    env_file:
      - .env
    depends_on:
      - mock-inference
    restart: unless-stopped

  # ── Mock SageMaker inference endpoint ──────────────────────────────────────
  # This service replaces the real AWS SageMaker endpoint during local
  # development so the app can exercise the AI inference code path without
  # needing cloud credentials or a deployed model.
  # It responds to any POST with {"label": "working", "confidence": 0.94}.
  mock-inference:
    image: python:3.11-slim
    working_dir: /app
    command: >
      python -c "
      import http.server, json

      class Handler(http.server.BaseHTTPRequestHandler):
          def log_message(self, fmt, *args):
              pass  # suppress per-request noise

          def do_POST(self):
              # Consume the request body so the client doesn't hang
              length = int(self.headers.get('Content-Length', 0))
              self.rfile.read(length)
              body = json.dumps({'label': 'working', 'confidence': 0.94}).encode()
              self.send_response(200)
              self.send_header('Content-Type', 'application/json')
              self.send_header('Content-Length', len(body))
              self.end_headers()
              self.wfile.write(body)

          def do_GET(self):
              # Health-check endpoint
              self.send_response(200)
              self.end_headers()
              self.wfile.write(b'ok')

      http.server.HTTPServer(('0.0.0.0', 8080), Handler).serve_forever()
      "
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080')\""]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
